pool:
  vmImage: ubuntu-latest

trigger: none

stages:
- stage: rabbitmq_dev
  displayName: Deploy RabbitMQ - Dev
  jobs:
  - deployment: rabbitmq_dev
    displayName: Deploy RabbitMQ
    environment: Development
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: Kubernetes@1
            displayName: 'Apply Kubernetes'
            inputs:
              kubernetesServiceEndpoint: "datahub-4-dev"
              command: 'apply'
              useConfigurationFile: true
              configuration: 'resources/kubernetes/rabbitmq-dev.yaml'
              outputFormat: yaml

- stage: postgres_dev
  displayName: Deploy Postgres - Dev
  dependsOn: []
  jobs:
  - deployment: postgres_dev
    displayName: Deploy Postgres
    environment: Development
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: Kubernetes@1
            displayName: 'Apply Kubernetes'
            inputs:
              kubernetesServiceEndpoint: "datahub-4-dev"
              command: 'apply'
              useConfigurationFile: true
              configuration: 'resources/kubernetes/postgres.yaml'
              outputFormat: yaml