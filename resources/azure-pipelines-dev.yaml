         FEATURES_DISABLEWEBHOOKDELIVERY: "false"
         FEATURES_DISABLEWEBHOOKDELIVERYRETRY: "true"
         FEATURES_DISABLEMESSAGEREADING: "true"
         EVENTSELECTION_ENABLED: "false"
