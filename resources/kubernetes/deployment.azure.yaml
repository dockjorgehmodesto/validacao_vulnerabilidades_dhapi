apiVersion: v1
kind: Namespace
metadata:
  name: webhooks
---
apiVersion: v1
kind: Secret
metadata:
  name: conductorcr
  namespace: "#{NAMESPACE}#"
data:
  .dockerconfigjson: "#{registry-password}#"
type: kubernetes.io/dockerconfigjson
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: 'true'
  name: "webhooks"
  namespace: "#{NAMESPACE}#"
spec:
  ports:
    - port: 80
      protocol: TCP
      targetPort: http
  selector:
    app: "webhooks"
  type: LoadBalancer
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: #{DEPLOYMENT_NAME}#-#{Build.BuildId}#
  namespace: "#{NAMESPACE}#"
data:
  APP_PROFILE: "#{APP_PROFILE}#"
  DATABASE_CONNECTIONURI: "#{DATABASE_CONNECTIONURI}#"
  DATABASE_USER: "#{webhooks-database-user}#"
  DATABASE_PASSWORD: "#{webhooks-database-password}#"
  DATABASE_REUSECONNECTIONSONMAP: "#{DATABASE_REUSECONNECTIONSONMAP}#"
  DATABASE_SHOWSQL: "#{DATABASE_SHOWSQL}#"
  DATABASE_MIGRATIONPRINCIPAL_MAXIMUMPOOLSIZE: "#{DATABASE_MIGRATIONPRINCIPAL_MAXIMUMPOOLSIZE}#"
  DATABASE_MIGRATIONPRINCIPAL_MINIMUMIDLE: "#{DATABASE_MIGRATIONPRINCIPAL_MINIMUMIDLE}#"
  RABBIT_DIAL: "#{webhooks-rabbitmq-dial}#"
  RABBIT_VIRTUALHOST: "#{RABBIT_VIRTUALHOST}#"
  RABBIT_RETRYNUMBER: "#{RABBIT_RETRYNUMBER}#"
  RABBIT_DEFAULTEXCHANGENAME: "#{RABBIT_DEFAULTEXCHANGENAME}#"
  RABBIT_DEFAULTQUEUENAME: "#{RABBIT_DEFAULTQUEUENAME}#"
  RABBIT_DEFAULTQUEUEKEY: "#{RABBIT_DEFAULTQUEUEKEY}#"
  RABBIT_DEFAULTRETRYEXCHANGENAME: "#{RABBIT_DEFAULTRETRYEXCHANGENAME}#"
  RABBIT_DEFAULTRETRYQUEUENAME: "#{RABBIT_DEFAULTRETRYQUEUENAME}#"
  RABBIT_DEFAULTRETRYQUEUEKEY: "#{RABBIT_DEFAULTRETRYQUEUEKEY}#"
  SWAGGER_IP: "#{SWAGGER_IP}#"
  SWAGGER_PORT: "#{SWAGGER_PORT}#"
  SWAGGER_SCHEME: "#{SWAGGER_SCHEME}#"
  SERVER_IP: "#{SERVER_IP}#"
  LOG_LEVEL: "#{LOG_LEVEL}#"
  LOG_BILLING_ENABLED: "#{LOG_BILLING_ENABLED}#"
  LOG_BILLING_TCP_CONNECTIONSTRING: "#{LOG_BILLING_TCP_CONNECTIONSTRING}#"
  LOG_BILLING_TCP_ENABLED: "#{LOG_BILLING_TCP_ENABLED}#"
  AMQP_WORKERCOUNT_RABBITMQCONNECTOR: "#{AMQP_WORKERCOUNT_RABBITMQCONNECTOR}#"
  AMQP_WORKERCOUNT_SERVICEBUSCONNECTOR: "#{AMQP_WORKERCOUNT_SERVICEBUSCONNECTOR}#"
  AMQP_WORKERCOUNT_WEBHOOKDELIVERER: "#{AMQP_WORKERCOUNT_WEBHOOKDELIVERER}#"
  AMQP_SERVICEBUSPREFETCH: "#{AMQP_SERVICEBUSPREFETCH}#"
  HTTP_TIMEOUTSECS: "#{HTTP_TIMEOUTSECS}#"
  HTTP_TRANSPORT_MAXIDLECONNS: "#{HTTP_TRANSPORT_MAXIDLECONNS}#"
  CACHE_ENABLED: "#{CACHE_ENABLED}#"
  CACHE_DEFAULTEXPIRATIONSECONDS: "#{CACHE_DEFAULTEXPIRATIONSECONDS}#"
  CACHE_ENTITIES_TENANT: "#{CACHE_ENTITIES_TENANT}#"
  CACHE_ENTITIES_KEYVAULTS: "#{CACHE_ENTITIES_KEYVAULTS}#"
  CACHE_ENTITIES_WEBHOOKS: "#{CACHE_ENTITIES_WEBHOOKS}#"
  CACHE_ENTITIES_QUEUEDELIVERY: "#{CACHE_ENTITIES_QUEUEDELIVERY}#"
  CACHE_REDIS_ENABLED: "#{CACHE_REDIS_ENABLED}#"
  CACHE_REDIS_DB: "#{CACHE_REDIS_DB}#"
  CACHE_REDIS_ADDR: "#{CACHE_REDIS_ADDR}#"
  CACHE_REDIS_PASSWORD: "#{webhooks-redis-password}#"
  CACHE_REDIS_USETLS: "#{CACHE_REDIS_USETLS}#"
  LOG_SPLUNK: "#{LOG_SPLUNK}#"
  LOG_STDOUT_ENABLE: "#{LOG_STDOUT_ENABLE}#"
  SPLUNK_DIAL: "#{SPLUNK_DIAL}#"
  SPLUNK_USETCP: "#{SPLUNK_USETCP}#"
  SPLUNK_HEC_HOST: "#{SPLUNK_HEC_HOST}#"
  SPLUNK_HEC_TOKEN: "#{splunk-token}#"
  SPLUNK_HEC_SKIPTLS: "#{SPLUNK_HEC_SKIPTLS}#"
  FEATURES_DISABLEWEBHOOKDELIVERY: "#{FEATURES_DISABLEWEBHOOKDELIVERY}#"
  FEATURES_DISABLEWEBHOOKDELIVERYRETRY: "#{FEATURES_DISABLEWEBHOOKDELIVERYRETRY}#"
  FEATURES_DISABLEMESSAGEREADING: "#{FEATURES_DISABLEMESSAGEREADING}#"
  EVENTSELECTION_ENABLED: "#{EVENTSELECTION_ENABLED}#"
  EVENTSELECTION_ISSUERS: "#{EVENTSELECTION_ISSUERS}#"
  EVENTSELECTION_EVENTS: "#{EVENTSELECTION_EVENTS}#"
  RABBIT_QOS_PREFETCHCOUNT: "#{RABBIT_QOS_PREFETCHCOUNT}#"
  DATADOG_AGENT_HOST: "#{DATADOG_AGENT_HOST}#"
  DATADOG_AGENT_PORT: "#{DATADOG_AGENT_PORT}#"
  DATADOG_ENABLED: "#{DATADOG_ENABLED}#"
  DD_LOGS_INJECTION: "#{DD_LOGS_INJECTION}#"
  DD_PROFILING_ENABLED: "#{DD_PROFILING_ENABLED}#"
  APP_SERVICENAME: "#{DEPLOYMENT_NAME}#"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "#{DEPLOYMENT_NAME}#"
  namespace: "#{NAMESPACE}#"
spec:
  replicas: #{DEPLOYMENT_REPLICAS}#
  selector:
    matchLabels:
      service: "#{DEPLOYMENT_NAME}#"
  template:
    metadata:
      labels:
        app: "webhooks"
        service: "#{DEPLOYMENT_NAME}#"
        version: "#{Build.BuildId}#"
        tags.datadoghq.com/env: "prod"
        tags.datadoghq.com/service: "#{DEPLOYMENT_NAME}#"
      annotations:
        ad.datadoghq.com/webhooks.check_names: '["openmetrics"]'
        ad.datadoghq.com/webhooks.init_configs: '[{}]'
        ad.datadoghq.com/webhooks.logs: '[{"source": "webhooks","service":"#{DEPLOYMENT_NAME}#"}]'
        # ad.datadoghq.com/webhooks.instances: |
        #   [
        #     {
        #       "prometheus_url": "http://%%host%%:%%port%%/v1/metrics",
        #       "namespace": "webhooks",
        #       "metrics": [{"go*":""},{"message_*":""}],
        #       "send_histograms_buckets": true,
        #       "send_distribution_buckets": true,
        #       "tags": ["pod_name:%%env_POD_NAME%%"]
        #     }
        #   ]
    spec:
      # nodeSelector: #{NODE_SELECTOR}#
      tolerations:
        - key: "app"
          value: "wb_processor"
          effect: "NoSchedule"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - wb_processor # Referência direta ao seu label de nó
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: [ "#{DEPLOYMENT_NAME}#" ]
                topologyKey: kubernetes.io/hostname
              weight: 100
      
      imagePullSecrets:
        - name: conductorcr
        # - name: conductorcrazurecrio
      containers:
        - name: webhooks
          resources:
            requests:
              cpu: "#{CONTAINER_REQUESTS_CPU}#"
              memory: "#{CONTAINER_REQUESTS_MEMORY}#"
            limits:
              cpu: "#{CONTAINER_LIMITS_CPU}#"
              memory: "#{CONTAINER_LIMITS_MEMORY}#"
          env:
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: status.hostIP
            - name: DD_TRACE_STARTUP_LOGS
              value: "false"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: #{DEPLOYMENT_NAME}#-#{Build.BuildId}#
          image: "#{IMAGE}#"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              protocol: TCP
              containerPort: 8080
          livenessProbe:
            httpGet:
              httpHeaders:
                - name: caller
                  value: healthcheck-k8s-liveness
              path: /v1/manager/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              httpHeaders:
                - name: caller
                  value: healthcheck-k8s-readiness
              path: /v1/manager/health
              port: 8080
            initialDelaySeconds: #{INITIAL_DELAY_SECONDS}# 
            periodSeconds: 5
            timeoutSeconds: 2
---
