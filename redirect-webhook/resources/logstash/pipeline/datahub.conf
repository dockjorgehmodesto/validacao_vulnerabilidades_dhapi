input {
    #    file {
    #        path => "${PIPELINE_INPUT_FILE_PATH:/applogs/billing*.log}"
    #        codec => json
    #        sincedb_path => "${SINCEDB_PATH}"
    #    }
    tcp {
        port => "${PIPELINE_TCP_PORT}"
        codec => json
    }
}

filter {

    if [data][type] == "SERVICEBUS" {
        json {
            source => "[data][data][message]"
            target => "[data][data][message]"
        }

        if [data][data][eventType] == "person" {
            mutate {
                remove_field => ["[data][data][message][name]","[data][data][message][tax_identification_number]", "[data][data][message][document_id]", "[data][data][message][mother]", "[data][data][message][father]", "[data][data][message][spouse_name]", "[data][data][message][bank_account]", "[data][data][message][email]"]
            }
        }

        if [data][data][eventType] == "address" {
            mutate {
                remove_field => ["[data][data][message][complement]"]
            }
        }

        if [data][data][eventType] == "phone" {
            mutate {
                remove_field => ["[data][data][message][number]"]
            }
        }

        if [data][data][eventType] == "account" {
            mutate {
                remove_field => ["[data][data][message][number]", "[data][data][message][product][issuer_bank_number]", "[data][data][message][product][issuer_branch_number]", "[data][data][message][product][issuer_account_number]"]
            }
        }

    }

    if [data][type] == "HTTP" {
        json {
            source => "[data][data][response]"
            target => "[data][data][response]"
        }

        json {
            source => "[data][data][request]"
            target => "[data][data][request]"
        }

        if [data][data][pattern] == "/v1/amqp/" and [data][data][method] == "POST" {
            mutate {
                remove_field => ["[data][data][request][connectionString]"]
            }
        }

        if [data][data][pattern] == "/v1/amqp/" and [data][data][method] == "PUT" {
            mutate {
                remove_field => ["[data][data][request][connectionString]"]
            }
        }

        if [data][data][pattern] == "/v1/encryption/key-vaults" and [data][data][method] == "POST" {
            mutate {
                remove_field => ["[data][data][request][publicKey]"]
            }
        }

        if [data][data][pattern] == "/v1/encryption/key-vaults/{id}" and [data][data][method] == "GET" {
            mutate {
                remove_field => ["[data][data][response][issuerPublicKey]"]
            }
        }

        if [data][data][pattern] == "/v1/encryption/key-vaults/{id}" and [data][data][method] == "PUT" {
            mutate {
                remove_field => ["[data][data][request][publicKey]"]
            }
        }

        if [data][data][pattern] == "/v1/encryption/key-vaults/{id}/aes/encrypt" and [data][data][method] == "POST" {
            mutate {
                remove_field => ["[data][data][response]"]
            }
        }

    }
}

output {
    if ("" in [data][data][eventType]) {
        adls {
            adls_fqdn => "${ADLS_FQDN}"                                                                              # (required)
            adls_token_endpoint => "${ADLS_TOKEN_ENDPOINT}"                                                          # (required)
            adls_client_id => "${ADLSCLIENTID}"                                                                    # (required)
            adls_client_key => "${ADLSCLIENTKEY}"                                                                  # (required)
            path => "${ADLS_PATH_EVENTS}"      # (required)
            test_path => "${PIPELINE_OUTPUT_ADLS_TEST_PATH:/Conductor/Billing/logstash.log}"                         # (optional, default "testfile")
            line_separator => ""                                                                                     # (optional, default: "\n")
            created_files_permission => 755                                                                          # (optional, default: 755)
            adls_token_expire_security_margin => 300                                                                 # (optional, default: 300)
            single_file_per_thread => true                                                                           # (optional, default: true)
            retry_interval => 0.5                                                                                    # (optional, default: 0.5)
            max_retry_interval => 10                                                                                 # (optional, default: 10)
            retry_times => 3                                                                                         # (optional, default: 3)
            exit_if_retries_exceeded => false                                                                        # (optional, default: false)
            codec => "json_lines"
        }
    } else {
        adls {
            adls_fqdn => "${ADLS_FQDN}"                                                                              # (required)
            adls_token_endpoint => "${ADLS_TOKEN_ENDPOINT}"                                                          # (required)
            adls_client_id => "${ADLSCLIENTID}"                                                                    # (required)
            adls_client_key => "${ADLSCLIENTKEY}"                                                                  # (required)
            path => "${ADLS_PATH_GENERAL}"      # (required)
            test_path => "${PIPELINE_OUTPUT_ADLS_TEST_PATH:/Conductor/Billing/logstash.log}"                         # (optional, default "testfile")
            line_separator => ""                                                                                     # (optional, default: "\n")
            created_files_permission => 755                                                                          # (optional, default: 755)
            adls_token_expire_security_margin => 300                                                                 # (optional, default: 300)
            single_file_per_thread => true                                                                           # (optional, default: true)
            retry_interval => 0.5                                                                                    # (optional, default: 0.5)
            max_retry_interval => 10                                                                                 # (optional, default: 10)
            retry_times => 3                                                                                         # (optional, default: 3)
            exit_if_retries_exceeded => false                                                                        # (optional, default: false)
            codec => "json_lines"
        }
    }
    
    
}