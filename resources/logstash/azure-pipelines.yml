- stage: logstash_prod
  displayName: Deploy Logstash - Prod
  dependsOn: 'build'
#  condition: succeeded()
  jobs:
  - deployment: logstash_prod
    displayName: Deploy Logstash
    environment: Production
    variables:
      NAMESPACE: "webhooks"
      IMAGE: "conductorcr.azurecr.io/webhooks-logstash:14225"
      NODE_SELECTOR: '{"shared": "true"}'
      ADLS_FQDN: "billingvnext.azuredatalakestore.net"
      ADLS_TOKEN_ENDPOINT: "https://login.microsoftonline.com/f2eccde6-5ae8-44fd-9564-e32faa577552/oauth2/token"
      ADLSCLIENTID: "30b76a14-6111-4fdc-a97d-1750e9451804"
      PIPELINE_OUTPUT_ADLS_TEST_PATH: "/obj.txt"
      SINCEDB_PATH: "/sincedb/file"
      ADLS_PATH_EVENTS: "/DataHub/%{[data][type]}/%{[data][issuerId]}/%{[data][data][eventType]}/%{+YYYY}/%{+MM}/%{+dd}/%{+HH}/datahub-%{[@metadata][cid]}.json"
      ADLS_PATH_GENERAL: "/DataHub/%{[data][type]}/%{[data][issuerId]}/%{+YYYY}/%{+MM}/%{+dd}/%{+HH}/datahub-%{[@metadata][cid]}.json"
      DEPLOYMENT_REPLICAS: 15
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: AzureKeyVault@1
            displayName: 'Get PAT Token'
            inputs:
              azureSubscription: 'Novo Ambiente'
              keyVaultName: 'aks-datahub-prod'
              secretsFilter: '*'

          - task: qetza.replacetokens.replacetokens-task.replacetokens@3
            displayName: 'Apply secrets in *.yaml'
            inputs:
              targetFiles: './resources/kubernetes/logstash.deployment.azure.yaml'

          - task: Kubernetes@1
            displayName: 'Apply Kubernetes'
            inputs:
              kubernetesServiceEndpoint: "DATAHUB-1"
              command: 'apply'
              useConfigurationFile: true
              configuration: 'resources/kubernetes/logstash.deployment.azure.yaml'
              outputFormat: yaml
