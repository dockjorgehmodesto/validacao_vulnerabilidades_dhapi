resources:
  repositories:
    - repository: templates
      type: git
      ref: refs/heads/datahub-new-cluster
      name: azure-pipeline-templates/azure-pipeline-templates

trigger:
  - candidate*
  - Candidate*
  - master

# pool:
#   vmImage: 'ubuntu-latest'
# pool: agents-k8s
pool: Azure Pipelines

stages:
- template: golang/golang.yaml@templates
  parameters:
    candidateContainerRegistry: 'conductorcr'
    prodContainerRegistry: 'conductorcr'
    candidateImageTags: '$(Build.BuildId)'
    prodImageTags: '$(Build.BuildId)'
    repository: 'webhooks'
    dockerfile: './resources/docker/Dockerfile'
    patSubscription: "Dev/Test Subscriptionnew"
    deployStages:
      - name: "prodprocessor"
        displayName: "Production Processor"
        condition: "contains(variables['Build.SourceBranch'], 'refs/heads/candidate/new-cluster')"
        environment: "Production"
        variables:
          NAMESPACE: "webhooks"
          DEPLOYMENT_NAME: "webhooks-processor"
          APP_PROFILE: "prod"
          IMAGE: "conductorcr.azurecr.io/webhooks:$(Build.BuildId)"
          NODE_SELECTOR: '{"wb_processor": "true"}'
          DATABASE_CONNECTIONURI: "host=10.47.32.5 port=5432 dbname=webhook sslmode=require"
          DATABASE_MIGRATIONPRINCIPAL_MAXIMUMPOOLSIZE: "4"
          DATABASE_MIGRATIONPRINCIPAL_MINIMUMIDLE: "4"
          DATABASE_REUSECONNECTIONSONMAP: "true"
          DATABASE_SHOWSQL: "false"
          RABBIT_RETRYNUMBER: "9"
          RABBIT_VIRTUALHOST: "webhooks"
          RABBIT_DEFAULTEXCHANGENAME: "DATAHUB_SHARED_REGULAR"
          RABBIT_DEFAULTQUEUENAME: "pier.hooks.DATAHUB_SHARED_REGULAR"
          RABBIT_DEFAULTQUEUEKEY: "pier.hooks.DATAHUB_SHARED_REGULAR_KEY"
          RABBIT_DEFAULTRETRYEXCHANGENAME: "DATAHUB_SHARED_RETRY"
          RABBIT_DEFAULTRETRYQUEUENAME: "pier.hooks.DATAHUB_SHARED_RETRY"
          RABBIT_DEFAULTRETRYQUEUEKEY: "pier.hooks.DATAHUB_SHARED_RETRY_KEY"
          SWAGGER_IP: "10.47.2.190"
          SERVER_IP: "10.47.2.190"
          SWAGGER_PORT: "80"
          SWAGGER_SCHEME: "http"
          LOG_LEVEL: "info"
          LOG_BILLING_ENABLED: "false"
          LOG_BILLING_TCP_ENABLED: "false"
          LOG_BILLING_TCP_CONNECTIONSTRING: "logstash-svc.webhooks.svc.cluster.local:5000"
          AMQP_WORKERCOUNT_RABBITMQCONNECTOR: "50"
          AMQP_WORKERCOUNT_SERVICEBUSCONNECTOR: "50"
          AMQP_WORKERCOUNT_WEBHOOKDELIVERER: "250"
          AMQP_SERVICEBUSPREFETCH: "20"
          HTTP_TIMEOUTSECS: "5"
          HTTP_TRANSPORT_MAXIDLECONNS: "100"
          CACHE_DEFAULTEXPIRATIONSECONDS: "7200"
          CACHE_ENABLED: "false"
          CACHE_ENTITIES_TENANT: "false"
          CACHE_ENTITIES_KEYVAULTS: "true"
          CACHE_ENTITIES_WEBHOOKS: "true"
          CACHE_ENTITIES_QUEUEDELIVERY: "true"
          CACHE_REDIS_ENABLED: "true"
          CACHE_REDIS_DB: "10"
          CACHE_REDIS_ADDR: "redis-haproxy.redis.svc.cluster.local:6379"
