pool:
  vmImage: ubuntu-latest

trigger: none

stages:
- stage: rabbitmq_hmle
  displayName: Deploy RabbitMQ - HMLE
  jobs:
  - deployment: rabbitmq_hmle
    displayName: Deploy RabbitMQ
    environment: Hmle
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: Kubernetes@1
            displayName: 'Apply Kubernetes'
            inputs:
              kubernetesServiceEndpoint: "AZ1D-VNEXT-AKS-HMLE"
              command: 'apply'
              useConfigurationFile: true
              configuration: 'resources/kubernetes/rabbitmq.statefulset.yaml'
              outputFormat: yaml
