resources:
  repositories:
    - repository: templates
      type: git
      ref: refs/heads/datahub-new-cluster
      name: azure-pipeline-templates/azure-pipeline-templates

trigger:
  - candidate*
  - Candidate*
  - master
  - feature*

# pool:
#   vmImage: 'ubuntu-latest'
pool: Azure Pipelines

stages:
- template: golang/golang.yaml@templates
  parameters:
   candidateContainerRegistry: 'conductorcr'
   prodContainerRegistry: 'conductorcr'
   candidateImageTags: '$(Build.BuildId)'
   prodImageTags: '$(Build.BuildId)'
   repository: 'webhooks'
   dockerfile: './resources/docker/Dockerfile'
  #  patSubscription: "DEV/Test - Subs"
   patSubscription: "Dev/Test Subscriptionnew"
   deployStages:
     - name: "devprocessor"
       displayName: "Dev Processor"
       condition: succeeded()
       environment: "Development"
       variables:
         NAMESPACE: "webhooks"
         DEPLOYMENT_NAME: "webhooks-processor"
         APP_PROFILE: "dev"
         IMAGE: "conductorcr.azurecr.io/webhooks:$(Build.BuildId)"
         NODE_SELECTOR: "{}"
        #  DATABASE_CONNECTIONURI: "host=10.70.61.8 port=5432 dbname=hmle_service_webhooks sslmode=require application_name=webhooks"
         DATABASE_CONNECTIONURI: "host=postgres-svc.webhooks.svc.cluster.local port=5432 dbname=webhook_dev sslmode=disable"
        #  DATABASE_USER: "dev_service_webhooks"
        #  DATABASE_PASSWORD: "dev_service_webhooks"
         DATABASE_MIGRATIONPRINCIPAL_MAXIMUMPOOLSIZE: "2"
         DATABASE_MIGRATIONPRINCIPAL_MINIMUMIDLE: "2"
         DATABASE_REUSECONNECTIONSONMAP: "true"
         # CONFIGURAÇÃO DO RABBITMQ (DNS INTERNO)
         RABBIT_HOST: "rabbitmq-svc.webhooks.svc.cluster.local"
         RABBIT_PORT: "5672"
         RABBIT_RETRYNUMBER: "9"
         RABBIT_VIRTUALHOST: "/"
         RABBIT_DEFAULTEXCHANGENAME: "DATAHUB_DEV_DELIVERY"
         RABBIT_DEFAULTQUEUENAME: "DATAHUB_DEV_DELIVERY"
         RABBIT_DEFAULTQUEUEKEY: "DATAHUB_DEV_DELIVERY_KEY"
         RABBIT_DEFAULTRETRYEXCHANGENAME: "DATAHUB_DEV_DELIVERY"
         RABBIT_DEFAULTRETRYQUEUENAME: "DATAHUB_DEV_DELIVERY"
         RABBIT_DEFAULTRETRYQUEUEKEY: "DATAHUB_DEV_DELIVERY_KEY"
         SWAGGER_IP: "10.70.64.114"
         SERVER_IP: "10.70.64.114"
         SWAGGER_PORT: "80"
         SWAGGER_SCHEME: "http"
         LOG_LEVEL: "info"
         LOG_BILLING_ENABLED: "false"
         LOG_BILLING_TCP_ENABLED: "false"
         LOG_BILLING_TCP_CONNECTIONSTRING: "logstash-svc.webhooks.svc.cluster.local:5000"
         AMQP_WORKERCOUNT_RABBITMQCONNECTOR: "50"
         AMQP_WORKERCOUNT_SERVICEBUSCONNECTOR: "50"
         AMQP_WORKERCOUNT_WEBHOOKDELIVERER: "150"
         AMQP_SERVICEBUSPREFETCH: "20"
         HTTP_TIMEOUTSECS: "5"
         HTTP_TRANSPORT_MAXIDLECONNS: "100"
         CACHE_DEFAULTEXPIRATIONSECONDS: "600"
         CACHE_ENABLED: "true"
         CACHE_ENTITIES_TENANT: "false"
         CACHE_ENTITIES_KEYVAULTS: "true"
         CACHE_ENTITIES_WEBHOOKS: "false"
         CACHE_REDIS_ENABLED: "true"
         CACHE_REDIS_DB: "10"
         CACHE_REDIS_ADDR: "redis-haproxy.redis.svc.cluster.local:6379"
         CACHE_REDIS_USETLS: "false"
         LOG_SPLUNK: "false"
         SPLUNK_DIAL: "10.50.80.18:15887"
         SPLUNK_USETCP: "true"
         SPLUNK_HEC_HOST: "https://10.50.80.48:8088/services/collector"
         SPLUNK_HEC_SKIPTLS: "true"
         FEATURES_DISABLEWEBHOOKDELIVERY: "true"
         FEATURES_DISABLEWEBHOOKDELIVERYRETRY: "true"
         FEATURES_DISABLEMESSAGEREADING: "false"
         EVENTSELECTION_ENABLED: "false"
         EVENTSELECTION_ISSUERS: ""
         EVENTSELECTION_EVENTS: ""
         DEPLOYMENT_REPLICAS: 1
         RABBIT_QOS_PREFETCHCOUNT: "500"
         DATADOG_ENABLED : "false"
         DATADOG_AGENT_HOST: "datadog-cluster-agent.datadog.svc.cluster.local"
         DATADOG_AGENT_PORT: "8125"
         CONTAINER_REQUESTS_MEMORY: "700Mi"
         CONTAINER_LIMITS_MEMORY: "1400Mi"
         CONTAINER_REQUESTS_CPU: "900m"
         CONTAINER_LIMITS_CPU: "1300m"

       getKeyvaultSecrets: true
       keyvaultAzureSubscription:  "Dev/Test Subscriptionnew"
       keyvaultName: "az1dkeyvaulvnext"
       kubernetesServiceEndpoint: "datahub-4-dev"
       kubernetesResourcesDirectory: "./resources/kubernetes/deployment.azure.yaml"
       kubernetesDryRun: false
       preSteps: []

